<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Календарь Уарза</title>
  <meta name="description" content="Календарь Уарза: 8 месяцев по 45 дней, 9-дневная неделя, выходные 1/5/9 и дни баланса. Григорианская дата рядом с каждой датой.">
  <meta name="theme-color" content="#070910">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0e18'/%3E%3Cpath d='M32 10l4.6 14.2L51 29l-14.4 4.8L32 48l-4.6-14.2L13 29l14.4-4.8z' fill='%23d8b462'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <div class="app">
    <header class="masthead">
      <div class="brand">
        <span class="sigil" aria-hidden="true">✦</span>
        <div>
          <h1>Календарь Уарза</h1>
        </div>
      </div>

      <section class="today" aria-live="polite">
        <div class="today-main">
          <span class="today-kicker" id="hero-kicker">Сегодня</span>
          <span class="today-day" id="hero-day">—</span>
          <span class="today-month" id="hero-month">—</span>
          <span class="today-weekday" id="hero-weekday">—</span>
        </div>
        <div class="today-sub">
          <span class="today-gregorian" id="hero-gregorian">—</span>
          <button type="button" class="link" id="back-today" hidden>вернуться к сегодня</button>
        </div>
      </section>

      <div class="view-switch" role="tablist" aria-label="Вид календаря">
        <button type="button" role="tab" data-view="year" aria-selected="true">Год</button>
        <button type="button" role="tab" data-view="month" aria-selected="false">Месяц</button>
      </div>
    </header>

    <main>
      <section class="panel" id="panel-month" aria-label="Месяц">
        <div class="panel-head">
          <div class="nav">
            <button type="button" class="nav-btn" id="prev-year" aria-label="Предыдущий год"><span aria-hidden="true">«</span></button>
            <button type="button" class="nav-btn" id="prev-period" aria-label="Предыдущий месяц"><span aria-hidden="true">‹</span></button>
          </div>
          <h2 id="period-title">—</h2>
          <div class="nav">
            <button type="button" class="nav-btn" id="next-period" aria-label="Следующий месяц"><span aria-hidden="true">›</span></button>
            <button type="button" class="nav-btn" id="next-year" aria-label="Следующий год"><span aria-hidden="true">»</span></button>
          </div>
        </div>

        <div class="weekdays" id="weekdays"></div>
        <div class="days" id="days"></div>
        <p class="period-note" id="period-note"></p>
      </section>

      <section class="panel year-panel" id="panel-year" aria-label="Год" hidden>
        <div class="panel-head">
          <div class="nav">
            <button type="button" class="nav-btn" id="year-prev" aria-label="Предыдущий год"><span aria-hidden="true">«</span></button>
          </div>
          <div class="year-heading">
            <h2 id="year-title">—</h2>
            <p class="year-range" id="year-range"></p>
          </div>
          <div class="nav">
            <button type="button" class="nav-btn" id="year-next" aria-label="Следующий год"><span aria-hidden="true">»</span></button>
          </div>
        </div>
        <div class="year-grid" id="year-grid"></div>
      </section>
    </main>

    <footer class="foot">
      <div class="converter">
        <label for="conv">Григорианская дата</label>
        <input type="date" id="conv">
        <span class="arrow" aria-hidden="true">→</span>
        <output id="conv-out" for="conv">—</output>
      </div>
      <p class="footnote" id="footnote"></p>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
